name: CI
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Scan the fixtures
        run: go run ./cmd/lockin testdata
      - name: Cross-compile
        run: |
          for os in linux darwin windows; do for arch in amd64 arm64; do
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/lockin
          done; done
