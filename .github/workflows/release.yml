# Push a tag like v0.1.0 to release: binaries for Linux, macOS and Windows (amd64, arm64) as tarballs, plus
# checksums.txt, attached to a GitHub release. The GitHub Action (action.yml) downloads these.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

      - name: Build
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir dist
          for os in linux darwin windows; do for arch in amd64 arm64; do
            bin=lockin; [ "$os" = windows ] && bin=lockin.exe
            dir=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "$dir/$bin" ./cmd/lockin
            cp LICENSE README.md "$dir/"
            tar -czf "dist/lockin_${V}_${os}_${arch}.tar.gz" -C "$dir" "$bin" LICENSE README.md
          done; done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Check the Linux binary
        run: |
          tar -xzf dist/lockin_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz -C "$RUNNER_TEMP" lockin
          "$RUNNER_TEMP/lockin" --version
          "$RUNNER_TEMP/lockin" testdata > /dev/null

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
